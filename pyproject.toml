[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brew-cooldown"
version = "0.1.0"
description = "Conservative local observation cooldown for Homebrew upgrades"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
brew-cooldown = "brew_cooldown:main"

[tool.setuptools]
py-modules = ["brew_cooldown"]
